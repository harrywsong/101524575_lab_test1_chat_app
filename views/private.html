<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header p-3 border-bottom">
            <h3>Private Chat with <span id="targetUser"></span></h3>
            <button class="btn btn-warning btn-sm" id="exitChatBtn">Exit Private Chat</button>
        </div>
        
        <div class="chat-messages" id="messageArea">
            <!-- Messages will appear here -->
        </div>
        
        <div class="chat-input p-3 border-top">
            <div id="typingIndicator" class="text-muted small mb-2"></div>
            <div class="input-group">
                <input type="text" id="messageInput" class="form-control" placeholder="Type a message...">
                <button class="btn btn-primary" id="sendBtn">Send</button>
            </div>
        </div>
    </div>

    <!-- Include socket.io for real-time communication and event handling, private.js for client-side logic -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/private.js"></script>
</body>
</html>
